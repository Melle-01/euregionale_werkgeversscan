<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PERFACT | Euregionale Werkgeversscan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23252a28'/%3E%3Crect y='50' width='64' height='6' fill='%23ffd400'/%3E%3Ctext x='32' y='40' font-family='Arial' font-weight='900' font-size='34' text-anchor='middle' fill='%23ffd400'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#252a28;--muted:#656b64;--yellow:#ffd400;--yellow2:#fff3a3;--paper:#fff;--bg:#f4f5f2;--line:#dfe3dc;--green:#445b20;--orange:#f28c28;--shadow:0 10px 30px #1e2b1c0d;
--b-red:#d64545;--b-orange:#f28c28;--b-yg:#a8c23c;--b-green:#3d9143}
*{box-sizing:border-box}h1,h2,h3,h4{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}body{overflow-wrap:break-word;margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#252a28;color:white;border-bottom:4px solid var(--yellow)}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;flex-wrap:wrap}
.brand{font-size:21px;font-weight:900;letter-spacing:3px}.brand small{font-size:12px;font-weight:500;letter-spacing:.3px;color:#d5d8d2;margin-left:10px}
.langbox{display:flex;align-items:center;gap:6px}.langbox label{margin:0;color:white;font-size:12px;font-weight:600}.langbox select{width:auto;padding:8px;border-radius:7px}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{background:transparent;color:white;padding:9px 12px;border-radius:7px;font-size:14px}nav button.active,nav button:hover{background:var(--yellow);color:#222}
button,.btn{border:0;border-radius:9px;padding:12px 18px;background:var(--yellow);color:#252a28;font:700 15px inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #252a28;outline-offset:2px}
button.secondary{background:#e9ece6;color:#252a28}button.dark{background:#252a28;color:white}button:disabled{opacity:.4;cursor:not-allowed}
main{max-width:1200px;margin:30px auto;padding:0 20px 60px}.page{display:none}.page.active{display:block}
.hero{background:linear-gradient(125deg,#252a28 0%,#343b32 65%,#515d2d 100%);color:white;border-radius:22px;padding:clamp(28px,5vw,64px);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:360px;height:360px;border:65px solid #ffd40025;border-radius:50%;right:-100px;top:-110px}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:2px;font-weight:800;color:#e7efcd}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.06;max-width:750px;margin:16px 0}.hero p{font-size:19px;color:#e2e6df;max-width:700px}.chips{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}.chip{border:1px solid #ffffff55;border-radius:30px;padding:7px 13px;font-size:13px}
.herobtns{display:flex;gap:10px;flex-wrap:wrap}
.sectionhead{margin:35px 0 18px}.sectionhead h2{font-size:30px;margin:0 0 8px}.sectionhead p{color:var(--muted);margin:0;max-width:780px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card,.box{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}.card h3{margin:10px 0 6px}.card p,.box p{color:var(--muted);margin:5px 0}.iconbox{width:44px;height:44px;border-radius:12px;background:var(--yellow2);display:grid;place-items:center;font-size:22px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.step{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.step b{display:block;margin:8px 0}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat strong{font-size:30px;display:block;line-height:1.2}.stat span{font-size:13px;color:var(--muted)}
h1,h2,h3{line-height:1.2}h2{font-size:30px}h3{font-size:20px}
label{font-weight:700;display:block;margin:13px 0 6px}input[type=text],input[type=email],select,textarea{width:100%;padding:12px 13px;border:1px solid #cbd2c7;border-radius:9px;background:white;font:inherit;color:var(--ink)}.muted{color:var(--muted)}.small{font-size:13px;color:var(--muted)}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.fieldgrid .full{grid-column:1/-1}
.progress{height:10px;background:#e5e8e1;border-radius:30px;overflow:hidden;margin:12px 0 20px}.progress span{height:100%;display:block;background:var(--yellow);width:0}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.question{font-size:22px;margin:14px 0 6px}.qsub{font-size:17px;color:#3c423b;margin:0 0 6px}
.hint{margin:10px 0 0;padding:9px 13px;background:#f6f7f2;border-left:4px solid #cbd2c7;border-radius:6px;font-size:14px;color:#4b5249}
.answer{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;margin:9px 0;cursor:pointer;background:#fff}
.answer:hover{border-color:#bfc7b9}.answer.sel,.answer:has(input:checked){border:2px solid #d1ae00;background:#fffbea;padding:13px}
.answer input{margin-top:6px;accent-color:#bda000}.answer span.txt{font-weight:500;flex:1}
.lvl{flex:none;width:28px;height:28px;border-radius:50%;background:#eef0ea;display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:1px}
.answer.sel .lvl,.answer:has(input:checked) .lvl{background:var(--yellow)}
.answer.dk{border-style:dashed;background:#fafaf7}.answer.dk .lvl{font-size:15px}.answer small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.tip{margin:14px 0 0;font-size:13px;color:var(--muted)}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.pill{display:inline-block;padding:5px 10px;border-radius:30px;background:#f0f2ed;font-size:12px;font-weight:800}.pill.yellow{background:var(--yellow2)}
details.rules{margin:20px 0 4px;border:1px solid var(--line);border-radius:12px;background:#fbfbf8;padding:4px 16px}details.rules summary{cursor:pointer;font-weight:800;padding:10px 0}
details.rules ul{margin:4px 0 12px;padding-left:20px}details.rules li{margin:8px 0;color:#3c423b}details.rules li b{color:var(--ink)}
.scorebar{height:11px;background:#ecefe9;border-radius:20px;overflow:hidden;margin:10px 0}.scorebar span{height:100%;display:block;background:var(--bc,var(--yellow))}
.band-red{--bc:var(--b-red)}.band-orange{--bc:var(--b-orange)}.band-yg{--bc:var(--b-yg)}.band-green{--bc:var(--b-green)}
.bandpill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:30px;background:#f0f2ed;font-weight:800;font-size:12px}
.bandpill:before{content:"";width:11px;height:11px;border-radius:50%;background:var(--bc,#999);flex:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}.legend .bandpill{background:#fff;border:1px solid var(--line)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-top:16px}
.tcard{background:#fff;border:1px solid var(--line);border-top:6px solid var(--bc,var(--line));border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);break-inside:avoid}
.thead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.thead h3{margin:2px 0 4px;font-size:19px}.thead .sub{font-size:13px;color:var(--muted)}
.tscore{text-align:right;flex:none}.tscore strong{font-size:32px;line-height:1;display:block}.tscore span{font-size:12px;color:var(--muted);display:block}
.stat.sm strong{font-size:20px;overflow-wrap:anywhere}
.avgrow{display:grid;grid-template-columns:minmax(150px,280px) 1fr auto;gap:6px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.avgrow:first-child{border-top:0}.avgrow .scorebar{margin:0}.avgrow>span{white-space:nowrap}
.crit{display:grid;grid-template-columns:34px 1fr auto;gap:4px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.cid{font-weight:800;font-size:12px;background:var(--yellow2);border-radius:7px;padding:2px 0;margin-top:2px;text-align:center;display:inline-block;min-width:34px}
.ctext{font-size:14px;line-height:1.45}.ctext .ans{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.meter{display:inline-flex;gap:3px;margin-top:5px}.meter i{width:16px;height:8px;border-radius:3px;background:#e3e6df}.meter i.on{background:var(--bc,var(--ink))}
.cscore{text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;grid-column:2/-1}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;background:#fff2e5;border:1px solid #f4c690;color:#8a4b00;border-radius:30px;padding:2px 9px}
.flag:before{content:"\2691"}
.flaglist{display:grid;gap:8px;margin-top:8px}.flagrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:14px}
.nextgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.next{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}.next h4{margin:6px 0 8px;font-size:15px}
.next .now,.next .go{font-size:14px;margin:6px 0;padding:8px 10px;border-radius:8px}.next .now{background:#f4f5f2}.next .go{background:#f2f7e9;border-left:4px solid #8cae38}
.next b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:2px}
table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}th{background:#f0f2ed;position:sticky;top:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:white}
#overviewTable table{min-width:0}#overviewTable th,#overviewTable td{padding:10px 8px;font-size:13.5px}#overviewTable td:first-child,#overviewTable td:nth-child(4){white-space:nowrap}
td.sc{white-space:nowrap;font-weight:700}td.sc:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bc,#bbb);margin-right:7px}
footer{background:#252a28;color:#d9ddd6;padding:26px;text-align:center;font-size:13px;border-top:4px solid var(--yellow)}
.notice{padding:15px 18px;background:#fff8d6;border-left:5px solid var(--yellow);border-radius:8px;margin:16px 0}.good{background:#f2f7e9;border-left-color:#8cae38}.danger{background:#fff2e5;border-left-color:var(--orange)}
.empty{text-align:center;padding:38px;color:var(--muted)}.hide{display:none!important}
.mapimg{display:block;width:100%;max-width:850px;height:auto;margin:16px auto;border-radius:12px;background:#fff}
#printRoot{display:none}
.rep{font:13px/1.45 Arial,sans-serif;color:#252a28}.rep h1{border-bottom:5px solid #ffd400;padding-bottom:10px;font-size:24px}.rep h2{margin:22px 0 4px;font-size:18px}.rep h3{margin:14px 0 6px;font-size:14px}
.rep table{min-width:0;margin-top:6px}.rep td,.rep th{border:1px solid #ccc;padding:5px 7px;font-size:11.5px;vertical-align:top;position:static}.rep th{background:#fff3a3}
.rep .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--bc,#999)}.rep *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rep .foot{margin-top:18px;font-size:11px;color:#666}.rep .small{font-size:10.5px;color:#666}.rep section{break-inside:avoid-page;margin-bottom:10px}.rep .brk{page-break-before:always}
@media(max-width:750px){.two,.fieldgrid{grid-template-columns:1fr}.nav{align-items:flex-start}nav{width:100%}nav button{flex:1}.hero{padding:28px}.brand small{display:block;margin:3px 0 0}.tgrid{grid-template-columns:1fr}.crit{grid-template-columns:34px 1fr}.cscore{grid-column:2;text-align:left}}
@media print{header,footer,.no-print,button,nav{display:none!important}body{background:#fff}main{margin:0;max-width:none;padding:0}.card,.box,.tcard{box-shadow:none}
body.printing main{display:none!important}body.printing #printRoot{display:block!important}
body:not(.printing) .page{display:none!important}body:not(.printing) #page-results.active{display:block!important}
.tcard,.bandpill:before,.meter i,.scorebar span{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* Tabblad 'Over de scan' en hulpmelding bij het starten van de scan (nieuw; bestaande stijlen blijven ongewijzigd) */
.cards.wide{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.aboutlist{margin:0;padding-left:22px}.aboutlist li{margin:9px 0;color:#3c423b}
.clist{list-style:none;margin:14px 0 0;padding:0}.clist li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}.clist .cid{flex:none}
.helpnote b{display:block;font-size:17px;margin-bottom:4px}.helpnote span{display:block}.helpnote button{margin-top:12px}
/* zes tabbladen in de header: op bureaubladbreedte iets compacter, zodat de menubalk zoveel mogelijk op één regel blijft */
@media(min-width:751px){.nav{column-gap:12px}nav{gap:4px}nav button{padding:9px 10px}}


.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(560px,calc(100% - 32px));background:#252a28;color:#fff;padding:13px 18px;border-radius:10px;border-left:5px solid var(--yellow);box-shadow:var(--shadow);font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
.confirmwrap{position:fixed;inset:0;background:#252a2899;display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.confirmbox{background:#fff;color:var(--ink);max-width:460px;width:100%;border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.confirmbox p{margin:0 0 18px}.confirmbtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header><div class="nav">
 <div class="brand">PERFACT<small data-i18n="brand.sub"></small></div>
 <div class="langbox"><label for="languageSelect" title="Taal · Language · Sprache · Langue" aria-label="Taal · Language · Sprache · Langue">🌐</label><select id="languageSelect" aria-label="Taal · Language · Sprache · Langue" onchange="setLanguage(this.value)"><option value="nl">Nederlands</option><option value="de">Deutsch</option><option value="en">English</option><option value="fr">Français</option></select></div>
 <nav>
  <button data-page="home" class="active" data-i18n="nav.home"></button>
  <button data-page="euregio" data-i18n="nav.euregio"></button>
  <button data-page="about" data-i18n="nav.about"></button>
  <button data-page="scan" data-i18n="nav.scan"></button>
  <button data-page="results" data-i18n="nav.results"></button>
  <button data-page="overview" data-i18n="nav.overview"></button>
 </nav>
</div></header>
<main>
<section id="page-home" class="page active">
 <div class="hero">
  <div class="eyebrow" data-i18n="home.eyebrow"></div>
  <h1 data-i18n="home.title"></h1>
  <p data-i18n="home.lead"></p>
  <div class="chips"><span class="chip" data-i18n="home.chip1"></span><span class="chip" data-i18n="home.chip2"></span><span class="chip" data-i18n="home.chip3"></span><span class="chip" data-i18n="home.chip4"></span></div>
  <div class="herobtns"><button onclick="navigate('scan')" data-i18n="home.cta"></button><button class="secondary" onclick="navigate('euregio')" data-i18n="home.cta2"></button></div>
 </div>
 <div class="sectionhead"><h2 data-i18n="home.whatH"></h2><p data-i18n="home.whatP"></p></div>
 <div class="cards">
  <article class="card"><div class="iconbox">◎</div><h3 data-i18n="home.c1h"></h3><p data-i18n="home.c1p"></p></article>
  <article class="card"><div class="iconbox">⚑</div><h3 data-i18n="home.c2h"></h3><p data-i18n="home.c2p"></p></article>
  <article class="card"><div class="iconbox">▤</div><h3 data-i18n="home.c3h"></h3><p data-i18n="home.c3p"></p></article>
  <article class="card"><div class="iconbox">▦</div><h3 data-i18n="home.c4h"></h3><p data-i18n="home.c4p"></p></article>
 </div>
 <div class="sectionhead"><h2 data-i18n="home.stepsH"></h2></div>
 <div class="steps">
  <div class="step"><span class="pill yellow">01</span><b data-i18n="home.s1h"></b><span class="small" data-i18n="home.s1p"></span></div>
  <div class="step"><span class="pill yellow">02</span><b data-i18n="home.s2h"></b><span class="small" data-i18n="home.s2p"></span></div>
  <div class="step"><span class="pill yellow">03</span><b data-i18n="home.s3h"></b><span class="small" data-i18n="home.s3p"></span></div>
  <div class="step"><span class="pill yellow">04</span><b data-i18n="home.s4h"></b><span class="small" data-i18n="home.s4p"></span></div>
 </div>
 <div class="notice" data-i18n-html="home.notice"></div>
</section>

/* EN - "About the scan" tab and the help notice when starting the scan */
Object.assign(I18N.en.ui,{
"nav.about":"About the scan",
"scan.helpH":"Not sure about something?",
"scan.helpP":"If something is unclear, for example how to answer a question or how the scan works, go to the ‘About the scan’ tab at the top of the page or click the button below: you will get an explanation straight away.",

"about.badge":"Explanation","about.h2":"About the scan",
"about.lead":"Here you can read what the scan is for, how to complete it and how to read the results.",
"about.whatH":"What is the scan for?",
"about.whatP1":"The employer scan is a self-assessment for employers in the Euregio Meuse-Rhine. You assess your organisation on 30 criteria, spread over 6 themes. The questions are written from the perspective of the organisation as an employer.",
"about.whatP2":"The outcome is a practical baseline measurement: you see what is already well in place and where attention is needed. You can use it to set priorities and formulate improvement actions.",
"about.howH":"How it works","about.howP":"From profile to result in four steps.",
"about.s1p":"Enter the name of your organisation (required) and choose the sector, number of employees and experience with cross-border workers. Also state your own role; your name is optional.",
"about.s2p":"For each criterion, choose the level (1 to 4) that fits, or ‘I don't know’. Use ‘Previous’ to go back; your answers are kept. Allow 10 to 20 minutes.",

"about.s4p":"Download your results as a CSV file or PDF report and discuss the next steps with your colleagues.",
"about.whoH":"Who completes the scan?",
"about.who1H":"One to three respondents",
"about.who1P":"One to three people from the organisation complete the scan, from the employer's perspective: HR, management, regional manager or account manager. The scan is not anonymous: your role is required, your name is optional.",
"about.who2H":"Several respondents",
"about.who2P":"Each respondent answers all 30 questions separately. After the first result, you add another respondent on the results page (maximum 3). The average of all respondents applies per criterion. If answers differ by 2 points or more, that criterion gets a flag. Because the results are stored locally, all respondents complete the scan on the same device and in the same browser.",
"about.levelsH":"How do you choose a level?",
"about.levelsP":"Each criterion has four levels. A higher level means something is arranged more fully and more firmly.",
"about.lv1":"Choose the level that fits how things are currently arranged in your organisation.",
"about.lv2":"Torn between two levels? Choose the lower one.",
"about.lv3":"Give a 4 only if you can demonstrate it, for example with a document, an agreement or an example.",
"about.lv4":"Don't know? Choose ‘I don't know’. This is allowed, counts as 1 and gets its own flag. The score then becomes less reliable.",
"about.lv5":"Is there a note below a question, for example ‘If not both parts apply, choose the lower level’? Then follow it.",
"about.readH":"How do you read the results?",
"about.readP":"Your results consist of an average, a colour, a rating and flags. Together they show where your organisation stands and where attention is needed.",

"about.r1P":"The average of the 5 criteria of the theme, on a scale of 1 to 4. With several respondents, the average is first taken per criterion.",
"about.r2H":"Colour",
"about.r2P":"The colour follows from the average of the theme (see the legend below). Red means little in place, green means well in place.",
"about.r3H":"Rating out of 10",
"about.r3P":"The average converted into a rating: (average − 1) ÷ 3 × 10. An average of 3.0 therefore becomes 6.7.",

"about.r5P":"The points of attention list the criteria scoring below 3, lowest first. You see how things are now and what the next level is.",
"about.r6H":"No overall score",
"about.r6P":"There is no overall score across all themes. Read each theme and each flag separately: even a good theme can contain a criterion that needs attention.",
"about.legendH":"Colours and what they mean",
"about.themesH":"The six themes",
"about.themesP":"Each theme consists of 5 criteria. Each criterion has a fixed code, for example C1 or W5, which you will see again in your results.",
"about.dataH":"Results, storage and downloads",
"about.d1P":"Here you see the measurement you have just completed, or opened from the overview, with all themes, criteria, flags and next steps.",
"about.d2P":"Here you find all measurements saved in this browser on this device. You can search by organisation, sort, open a measurement and view the average score per theme.",
"about.d3H":"Downloading",
"about.d3P":"Download your results as a CSV file for analysis, for example in Excel, or as a PDF report. For the PDF report, choose ‘Save as PDF’ in the print window.",
"about.d4H":"Storage",
"about.d4P":"Your answers are stored only locally in this browser on this device. If you clear your browser data or use another device, they will not be available there. You can also delete them with the button on the results overview.",
"about.d5H":"Language",
"about.d5P":"With the language selector at the top you can switch between Dutch, German, French and English at any time. Your answers are kept."

Object.assign(I18N.de.ui,{
"nav.about":"Über den Scan",
"scan.helpH":"Etwas unklar?",
"scan.helpP":"Wenn Sie etwas nicht verstehen, zum Beispiel wie Sie eine Frage beantworten oder wie der Scan funktioniert, wechseln Sie zum Reiter „Über den Scan“ oben auf der Seite oder klicken Sie auf die Schaltfläche unten: Sie erhalten sofort eine Erklärung.",
"scan.helpBtn":"Zu „Über den Scan“ →",
"about.badge":"Erläuterung","about.h2":"Über den Scan",
"about.lead":"Hier lesen Sie, wozu der Scan dient, wie Sie ihn ausfüllen und wie Sie die Ergebnisse lesen.",
"about.whatH":"Wozu dient der Scan?",
"about.whatP1":"Der Arbeitgeber-Scan ist ein Selbst-Scan für Arbeitgeber in der Euregio Maas-Rhein. Sie bewerten Ihre Organisation anhand von 30 Kriterien, verteilt auf 6 Themen. Die Fragen sind aus Sicht der Organisation als Arbeitgeber formuliert.",
"about.whatP2":"Das Ergebnis ist eine praktische Nullmessung: Sie sehen, was bereits gut geregelt ist und wo Aufmerksamkeit nötig ist. So können Sie Prioritäten setzen und Verbesserungsmaßnahmen formulieren.",
"about.howH":"So funktioniert es","about.howP":"In vier Schritten vom Profil zum Ergebnis.",
"about.s1p":"Tragen Sie den Namen Ihrer Organisation ein (Pflichtfeld) und wählen Sie Branche, Anzahl der Mitarbeitenden und Erfahrung mit Grenzgängern. Geben Sie außerdem Ihre eigene Rolle an; Ihr Name ist optional.",
"about.s2p":"Wählen Sie je Kriterium die passende Stufe (1 bis 4) oder „Weiß ich nicht“. Mit „Zurück“ gehen Sie einen Schritt zurück; Ihre Antworten bleiben erhalten. Rechnen Sie mit 10 bis 20 Minuten.",
"about.s3p":"Nach der letzten Frage sehen Sie je Thema den Durchschnitt, die Farbe, die Punktzahl bis 10 und die Markierungen. Anschließend können Sie eine weitere teilnehmende Person hinzufügen.",
"about.s4p":"Laden Sie Ihre Ergebnisse als CSV oder PDF-Bericht herunter und besprechen Sie die nächsten Schritte mit Ihren Kolleginnen und Kollegen.",
"about.whoH":"Wer füllt den Scan aus?",
"about.who1H":"Ein bis drei teilnehmende Personen",
"about.who1P":"Ein bis drei Personen aus der Organisation füllen den Scan aus, aus Sicht des Arbeitgebers: HR, Management, Regionalleitung oder Account Manager. Der Scan ist nicht anonym: Ihre Rolle ist Pflicht, Ihr Name ist optional.",
"about.who2H":"Mehrere teilnehmende Personen",
"about.who2P":"Jede Person beantwortet alle 30 Fragen selbst. Nach dem ersten Ergebnis fügen Sie auf der Ergebnisseite eine weitere Person hinzu (maximal 3). Je Kriterium gilt der Durchschnitt aller Teilnehmenden. Weichen die Antworten um 2 Punkte oder mehr voneinander ab, erhält das Kriterium eine Markierung. Da die Ergebnisse lokal gespeichert werden, füllen alle Teilnehmenden auf demselben Gerät und im selben Browser aus.",
"about.levelsH":"Wie wählen Sie eine Stufe?",
"about.levelsP":"Jedes Kriterium hat vier Stufen. Eine höhere Stufe bedeutet, dass etwas weiter und verbindlicher geregelt ist.",
"about.lv1":"Wählen Sie die Stufe, die dazu passt, wie es in Ihrer Organisation aktuell geregelt ist.",
"about.lv2":"Sie schwanken zwischen zwei Stufen? Wählen Sie die niedrigere.",
"about.lv3":"Eine 4 vergeben Sie nur, wenn Sie es belegen können, zum Beispiel mit einem Dokument, einer Vereinbarung oder einem Beispiel.",
"about.lv4":"Sie wissen es nicht? Wählen Sie „Weiß ich nicht“. Das ist erlaubt, zählt als 1 und erhält eine eigene Markierung. Die Punktzahl wird dann weniger zuverlässig.",
"about.lv5":"Steht unter einer Frage ein Hinweis, zum Beispiel „Trifft nicht beides zu, wählen Sie die niedrigere Stufe“? Dann folgen Sie ihm.",
"about.readH":"Wie lesen Sie die Ergebnisse?",
"about.readP":"Ihre Ergebnisse bestehen aus einem Durchschnitt, einer Farbe, einer Punktzahl und Markierungen. Zusammen zeigen sie, wo Ihre Organisation steht und wo Aufmerksamkeit nötig ist.",
"about.r1H":"Durchschnitt je Thema",
"about.r1P":"Der Durchschnitt der 5 Kriterien des Themas auf einer Skala von 1 bis 4. Bei mehreren Teilnehmenden wird zuerst je Kriterium gemittelt.",
"about.r2H":"Farbe",
"about.r2P":"Die Farbe ergibt sich aus dem Durchschnitt des Themas (siehe Legende unten). Rot bedeutet wenig geregelt, Grün bedeutet gut geregelt.",
"about.r3H":"Punktzahl bis 10",
"about.r3P":"Der in eine Punktzahl umgerechnete Durchschnitt: (Durchschnitt − 1) ÷ 3 × 10. Ein Durchschnitt von 3,0 ergibt also 6,7.",
"about.r4P":"Eine Markierung steht bei einem Kriterium, das Aufmerksamkeit braucht: bei einer 1, bei „Weiß ich nicht“ oder bei einem Unterschied von 2 Punkten oder mehr zwischen den Teilnehmenden. Eine Markierung bleibt bestehen, auch wenn das Thema grün ist.",
"about.r5P":"Bei den Handlungsfeldern stehen die Kriterien mit einem Wert unter 3, die niedrigsten zuerst. Sie sehen, wie es aktuell aussieht und welche Stufe als Nächstes ansteht.",
"about.r6H":"Kein Gesamtwert",
"about.r6P":"Es gibt keinen Gesamtwert über alle Themen. Lesen Sie jedes Thema und jede Markierung einzeln: Auch ein gutes Thema kann ein Kriterium enthalten, das Aufmerksamkeit braucht.",
"about.legendH":"Farben und ihre Bedeutung",
"about.themesH":"Die sechs Themen",
"about.themesP":"Jedes Thema besteht aus 5 Kriterien. Jedes Kriterium hat einen festen Code, zum Beispiel C1 oder W5, den Sie in Ihren Ergebnissen wiederfinden.",
"about.dataH":"Ergebnisse, Speicherung und Downloads",
"about.d1P":"Hier sehen Sie die Messung, die Sie gerade abgeschlossen oder aus der Übersicht geöffnet haben, mit allen Themen, Kriterien, Markierungen und nächsten Schritten.",
"about.d2P":"Hier finden Sie alle Messungen, die in diesem Browser auf diesem Gerät gespeichert sind. Sie können nach Organisation suchen, sortieren, eine Messung öffnen und den durchschnittlichen Wert je Thema ansehen.",
"about.d3H":"Herunterladen",
"about.d3P":"Laden Sie Ihre Ergebnisse als CSV-Datei für Analysen, zum Beispiel in Excel, oder als PDF-Bericht herunter. Für den PDF-Bericht wählen Sie im Druckfenster „Als PDF speichern“.",
"about.d4H":"Speicherung",
"about.d4P":"Ihre Antworten werden nur lokal in diesem Browser auf diesem Gerät gespeichert. Wenn Sie die Browserdaten löschen oder ein anderes Gerät verwenden, sind sie dort nicht verfügbar. Löschen können Sie sie auch mit der Schaltfläche in der Ergebnisübersicht.",
"about.d5H":"Sprache",
"about.d5P":"Mit der Sprachauswahl oben wechseln Sie jederzeit zwischen Niederländisch, Deutsch, Französisch und Englisch. Ihre Antworten bleiben erhalten."
});

function mean(a){return a.reduce(function(s,x){return s+x},0)/a.length}

 ALL_IDS.forEach(function(id){
  var ans=m.fillers.map(function(f){return f.answers[id]});
  var sc=ans.map(scoreOf);
  crits[id]={id:id,answers:ans,scores:sc,avg:mean(sc),
   dk:ans.indexOf('dk')>=0,
   low:ans.some(function(a){return Number(a)===1}),
   diff:sc.length>1&&Math.max.apply(null,sc)-Math.min.apply(null,sc)>=2};
 });
 var themes=THEMES.map(function(th){
  var avg=round1(mean(th.criteria.map(function(id){return crits[id].avg})));
  var dkIds=th.criteria.filter(function(id){return crits[id].dk});
  return {id:th.id,avg:avg,grade:round1((avg-1)/3*10),band:bandOf(avg),dkIds:dkIds};
 });
 THEMES.forEach(function(th){th.criteria.forEach(function(id){var c=crits[id];if(c.low||c.dk||c.diff)flags.push({id:id,themeId:th.id,low:c.low,dk:c.dk,diff:c.diff})})});

function toCSV(ms){
 var sep=LANG==='en'?',':';';
 return '﻿'+[csvHeader()].concat(ms.map(csvRow)).map(function(r){return r.map(csvCell).join(sep)}).join('\r\n');
}
function downloadCSVCurrent(){
 var m=pickCurrent();if(!m){notify(t('alert.noScan'));return}
 downloadBlob(toCSV([m]),t('file.base')+'-'+slug(m.org)+'.csv','text/csv;charset=utf-8');
}
function downloadAllCSV(){
 var a=loadAll();if(!a.length){notify(t('alert.noSaved'));return}
 downloadBlob(toCSV(a),t('file.base')+'-'+new Date().toISOString().slice(0,10)+'.csv','text/csv;charset=utf-8');
}

/* --- rapport: wordt in #printRoot opgebouwd en met de afdrukfunctie van de browser als PDF opgeslagen --- */
function repRow(l,v){return '<tr><th style="width:34%">'+esc(l)+'</th><td>'+esc(v)+'</td></tr>'}
function repDot(b){return '<span class="dot band-'+b+'"></span>'+esc(bandLabel(b))}
function repGenerated(){return '<p class="foot">'+esc(t('rep.generated',{date:fmtDate(new Date().toISOString())}))+'</p>'}
function repFooter(){return '<p class="foot">'+esc(t('rep.scale'))+'</p><p class="foot">'+esc(t('rep.foot'))+'</p>'}
function reportMeasurement(m){
 var s=scoreMeasurement(m),h='<h1>'+esc(t('rep.title',{org:m.org}))+'</h1>'+repGenerated();
 h+='<table>'+repRow(t('csv.date'),fmtDate(m.created))+repRow(t('csv.org'),m.org)+repRow(t('csv.sector'),optLabel('sector',m.sector))+repRow(t('csv.employees'),optLabel('emp',m.employees))+repRow(t('csv.exp'),optLabel('exp',m.experience))+repRow(t('csv.dir'),optLabel('dir',m.direction))+repRow(t('rep.fillers'),rolesOf(m))+'</table>';
 h+='<h2>'+esc(t('rep.themesH'))+'</h2><table><tr><th>'+esc(t('rep.theme'))+'</th><th>'+esc(t('rep.avg'))+'</th><th>'+esc(t('rep.grade'))+'</th><th>'+esc(t('rep.band'))+'</th><th>'+esc(t('rep.dk'))+'</th></tr>';
 THEMES.forEach(function(th,i){var r=s.themes[i];h+='<tr><td>'+esc(themeFull(th.id))+'</td><td>'+fmt(r.avg)+'</td><td>'+fmt(r.grade)+'</td><td>'+repDot(r.band)+' – '+esc(t('band.'+r.band+'D'))+'</td><td>'+(r.dkIds.length?esc(r.dkIds.length+'/5 ('+r.dkIds.join(', ')+')'):'–')+'</td></tr>'});
 h+='</table><h2>'+esc(t('res.flagsH'))+'</h2>';
 h+=s.flags.length?'<table><tr><th>'+esc(t('rep.crit'))+'</th><th>'+esc(t('rep.flags'))+'</th></tr>'+s.flags.map(function(f){return '<tr><td><b>'+f.id+'</b> '+esc(crit(f.id).t)+'</td><td>'+esc(flagLabels(f).join(', '))+'</td></tr>'}).join('')+'</table>':'<p>'+esc(t('res.flagsNone'))+'</p>';
 THEMES.forEach(function(th,i){
  var r=s.themes[i];
  h+='<section><h2>'+esc(themeFull(th.id))+' – '+fmt(r.avg)+'</h2><table><tr><th style="width:62%">'+esc(t('rep.crit'))+'</th><th>'+esc(t('rep.score'))+'</th><th>'+esc(t('rep.flags'))+'</th></tr>';
  th.criteria.forEach(function(id){
   var c=crit(id),d=s.crits[id],fl=flagLabels(d);
   var ans=m.fillers.length===1?ansText(c,d.answers[0]):d.answers.map(function(a){return a==='dk'?t('q.dk'):a}).join(' · ');
   h+='<tr><td><b>'+id+'</b> '+esc(c.t)+'<br><span class="small">'+esc(ans)+'</span></td><td>'+fmt(d.avg,m.fillers.length>1?1:0)+'</td><td>'+(fl.length?esc(fl.join(', ')):esc(t('rep.none')))+'</td></tr>';
  });
  h+='</table></section>';
 });
 return h+repFooter();
}
function reportAll(all){
 var rows=all.map(function(m){return {m:m,s:scoreMeasurement(m)}});
 var h='<h1>'+esc(t('rep.overviewTitle'))+'</h1>'+repGenerated()+'<table><tr><th>'+esc(t('ov.cDate'))+'</th><th>'+esc(t('ov.cOrg'))+'</th><th>'+esc(t('ov.cSector'))+'</th><th>'+esc(t('ov.cEmp'))+'</th><th>'+esc(t('ov.cFill'))+'</th>'+
  THEMES.map(function(th){return '<th>'+esc(themeName(th.id))+'</th>'}).join('')+'<th>'+esc(t('ov.cFlags'))+'</th></tr>';
 rows.forEach(function(r){
  var m=r.m;
  h+='<tr><td>'+esc(fmtDate(m.created))+'</td><td>'+esc(m.org)+'</td><td>'+esc(optLabel('sector',m.sector))+'</td><td>'+esc(optLabel('emp',m.employees))+'</td><td>'+m.fillers.length+'</td>'+
   r.s.themes.map(function(x){return '<td><span class="dot band-'+x.band+'"></span>'+fmt(x.avg)+'</td>'}).join('')+'<td>'+r.s.flags.length+'</td></tr>';
 });
 h+='</table><h2>'+esc(t('ov.avgH'))+'</h2><table><tr><th>'+esc(t('rep.theme'))+'</th><th>'+esc(t('rep.avg'))+'</th><th>'+esc(t('rep.grade'))+'</th><th>'+esc(t('rep.band'))+'</th></tr>';
 themeAverages(rows).forEach(function(a){h+='<tr><td>'+esc(themeFull(a.id))+'</td><td>'+fmt(a.avg)+'</td><td>'+fmt(a.grade)+'</td><td>'+repDot(a.band)+' – '+esc(t('band.'+a.band+'D'))+'</td></tr>'});
 return h+'</table><p class="foot">'+esc(t('ov.avgP'))+'</p>'+repFooter();
}
function printReport(html,title,landscape,fname){
 if(ART){
  if(!DL){notify(t('alert.dlFail'));return}
  var doc='<!doctype html><html lang="'+LANG+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(title)+'</title><style>'+REPCSS+'@page{size:A4 '+(landscape?'landscape':'portrait')+';margin:12mm}</style></head><body><div class="rep">'+html+'</div></body></html>';
  DL.save({filename:fname,data:doc}).catch(function(e){if(!e||e.code!=='declined')notify(t('alert.dlFail'))});
  return;
 }
 $('printRoot').innerHTML=html;
 var st=$('printPageStyle');
 if(!st){st=document.createElement('style');st.id='printPageStyle';document.head.appendChild(st)}
 st.textContent='@page{size:A4 '+(landscape?'landscape':'portrait')+';margin:12mm}';
 document.title=title;document.body.classList.add('printing');
 var done=function(){document.body.classList.remove('printing');document.title=t('meta.title');window.removeEventListener('afterprint',done)};
 window.addEventListener('afterprint',done);
 setTimeout(function(){try{window.print()}catch(e){done()}},60);
}
function downloadReport(){
 var m=pickCurrent();if(!m){notify(t('alert.noScan'));return}
 printReport(reportMeasurement(m),t('rep.title',{org:m.org}),false,t('file.base')+'-rapport-'+slug(m.org)+'.html');
}
function downloadAllReport(){
 var a=loadAll();if(!a.length){notify(t('alert.noSaved'));return}
 a.sort(function(x,y){return x.created<y.created?1:-1});
 printReport(reportAll(a),t('rep.overviewTitle'),true,t('file.base')+'-overzicht-'+new Date().toISOString().slice(0,10)+'.html');
}

/* --- weergave in een gepubliceerde pagina: opslaan via de viewer, meldingen in de pagina --- */
var DL=null,ART=false;
try{if(window.claude&&typeof window.claude.use==='function'){ART=true;window.claude.use('downloads').then(function(d){DL=d||null}).catch(function(){DL=null})}}catch(e){}
function notify(msg){
 var n=$('toast');
 if(!n){n=document.createElement('div');n.id='toast';n.className='toast';n.setAttribute('role','alert');document.body.appendChild(n)}
 n.textContent=msg;n.classList.add('on');
 clearTimeout(notify._t);notify._t=setTimeout(function(){n.classList.remove('on')},5000);
}
function askConfirm(msg,onYes){
 var old=$('confirmBox');if(old)old.remove();
 var w=document.createElement('div');w.id='confirmBox';w.className='confirmwrap';
 w.innerHTML='<div class="confirmbox" role="dialog" aria-modal="true"><p>'+esc(msg)+'</p><div class="confirmbtns"><button type="button" class="secondary" id="cfNo">'+esc(t('alert.no'))+'</button><button type="button" id="cfYes">'+esc(t('alert.yes'))+'</button></div></div>';
 document.body.appendChild(w);
 $('cfNo').onclick=function(){w.remove()};
 $('cfYes').onclick=function(){w.remove();onYes()};
 $('cfNo').focus();
}
var REPCSS="*{box-sizing:border-box}body{margin:0;padding:16px}table{border-collapse:collapse;width:100%}\n.band-red{--bc:var(--b-red)}.band-orange{--bc:var(--b-orange)}.band-yg{--bc:var(--b-yg)}.band-green{--bc:var(--b-green)}\n.rep{font:13px/1.45 Arial,sans-serif;color:#252a28}.rep h1{border-bottom:5px solid #ffd400;padding-bottom:10px;font-size:24px}.rep h2{margin:22px 0 4px;font-size:18px}.rep h3{margin:14px 0 6px;font-size:14px}\n.rep table{min-width:0;margin-top:6px}.rep td,.rep th{border:1px solid #ccc;padding:5px 7px;font-size:11.5px;vertical-align:top;position:static}.rep th{background:#fff3a3}\n.rep .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--bc,#999)}.rep *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.rep .foot{margin-top:18px;font-size:11px;color:#666}.rep .small{font-size:10.5px;color:#666}.rep section{break-inside:avoid-page;margin-bottom:10px}.rep .brk{page-break-before:always}";
